<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Private demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#DFDFDF;--card:#fff;--text:#383838;--muted:#818181;--blue:#3283FF;--err:#D93A3A;--line:#d6d6d6}
@media (prefers-color-scheme:dark){:root{--bg:#1C1C1C;--card:#262626;--text:#EAEAEA;--muted:#9A9A9A;--line:#3a3a3a}}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--text);font:500 16px/1.35 "Inter Tight",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.card{width:min(400px,100%);background:var(--card);border-radius:24px;padding:32px 28px;box-shadow:0 20px 50px rgba(0,0,0,.12)}
.logo{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:600;margin-bottom:28px}
.logo i{width:16px;height:16px;border:3px solid currentColor;border-radius:5px}
h1{font-size:26px;font-weight:500;letter-spacing:-.3px}
p{color:var(--muted);margin:8px 0 22px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
input{width:100%;height:48px;border:1px solid var(--line);border-radius:14px;padding:0 14px;font:inherit;color:var(--text);background:transparent;outline:none}
input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(50,131,255,.18)}
button{width:100%;height:48px;margin-top:12px;border:0;border-radius:999px;background:var(--blue);color:#fff;font:inherit;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.err{min-height:20px;margin-top:10px;font-size:14px;color:var(--err)}
</style>
</head>
<body>
<form class="card" id="gate" autocomplete="off">
  <div class="logo"><i></i>YourCo</div>
  <h1>Private demo</h1>
  <p>Enter the password you were given to open the Inventory Savings demo.</p>
  <label for="pw">Password</label>
  <input id="pw" type="password" autofocus required>
  <button id="go" type="submit">Unlock</button>
  <div class="err" id="err" role="alert"></div>
</form>

<script>
(() => {
  const P = JSON.parse(document.getElementById("payload").textContent);
  const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const form = document.getElementById("gate"), input = document.getElementById("pw"),
        btn = document.getElementById("go"), err = document.getElementById("err");
  if (!window.isSecureContext || !window.crypto || !crypto.subtle) {
    err.textContent = "This page needs a secure (https) connection. Try again in a few minutes.";
    btn.disabled = true; return;
  }
  async function unlock(pw) {
    btn.disabled = true; btn.textContent = "Unlocking…"; err.textContent = "";
    try {
      const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
      const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: bytes(P.s), iterations: P.n, hash: "SHA-256" },
        base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
      const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(P.i) }, key, bytes(P.c));
      try { sessionStorage.setItem("demo-unlock", pw); } catch (_) {}
      const page = new TextDecoder().decode(plain);
      document.open(); document.write(page); document.close();
    } catch (_) {
      try { sessionStorage.removeItem("demo-unlock"); } catch (_) {}
      err.textContent = "That password didn't work.";
      btn.disabled = false; btn.textContent = "Unlock"; input.select();
    }
  }
  form.addEventListener("submit", e => { e.preventDefault(); if (input.value) unlock(input.value); });
  let saved = null; try { saved = sessionStorage.getItem("demo-unlock"); } catch (_) {}
  if (saved) unlock(saved);
})();
</script>
